<!doctype html><html lang="fr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nam Anh Studio — Administration</title><link rel="icon" href="https://logo-namanhstudio.weebly.com/uploads/1/5/5/3/155356283/dark-mode-app-icon-favicon1_orig.png"><style>

padding-top:22px}.empty{color:var(--sub);
padding:31px 0}@media(max-width:850px){.side{transform:translateX(-100%);
transition:.2s}.side.open{transform:none}.main{margin:0;
padding:22px 17px}.mobile{display:flex;

</style></head><body><aside id="side" class="side"><img id="logo" class="logo" alt="Nam Anh Studio"><nav class="nav"><button class="active" data-view="dashboard"></button><button data-view="clients"></button><button data-view="orders"></button><button data-view="settings"></button></nav><div class="bottom"><div class="tool"><span data-t="language"></span><select id="language"><option value="fr">🇫🇷 Français</option><option value="en">🇬🇧 English</option><option value="vi">🇻🇳 Tiếng Việt</option></select></div><div class="tool"><span>☾ / ☀</span><button id="theme" class="theme"></button></div><button id="logout" class="logout" data-t="logout"></button></div></aside><main class="main"><div class="mobile"><img id="mobileLogo" alt="Nam Anh Studio"><button id="menu" class="menu">☰</button></div><header class="head"><div><div class="eyebrow">Nam Anh Studio</div><h1 id="pageTitle"></h1></div><div id="adminEmail" class="admin-email"></div></header><section id="dashboard" class="grid"></section></main><div id="modalRoot"></div><script>
const API=window.NAS_API_BASE||'/api',LOGOS={dark:'https://logo-namanhstudio.weebly.com/uploads/1/5/5/3/155356283/dark-mode-logo-ch-nh_orig.png',light:'https://logo-namanhstudio.weebly.com/uploads/1/5/5/3/155356283/light-mode-logo-ch-nh_orig.png'};
const D={fr:{dashboard:'Tableau de bord',clients:'Clients',orders:'Commandes',settings:'Paramètres',language:'Langue',logout:'Se déconnecter',hello:'Bonjour',recent:'Commandes récentes',loading:'Chargement des commandes…',empty:'Pas encore de commandes.',client:'Client',email:'E-mail',pack:'Pack',pages:'Pages',total:'Total',deadline:'Date souhaitée',status:'Statut',see:'Voir les détails',new:'Nouvelles commandes',progress:'En cours',almost:'Presque terminées',delivered:'Livrées',detail:'Détails de commande',save:'Enregistrer',saving:'Enregistrement…',saved:'Modifications enregistrées dans D1.',notes:'Notes internes',pricing:'Tarifs',pricingIntro:'Ces tarifs sont utilisés par les nouvelles commandes. Les commandes existantes gardent leur snapshot de prix.',priceSaved:'Tarifs enregistrés.',network:'Le serveur est indisponible. Réessayez.',access:'Cloudflare Access est requis pour l’administration.',received:'Reçue',approved:'Approuvée',in_progress:'En cours de réalisation',almost_done:'Presque terminée',deliveredStatus:'Livrée',orderCount:'commandes',latest:'Dernière commande',noClients:'Pas encore de clients.'},en:{dashboard:'Dashboard',clients:'Clients',orders:'Orders',settings:'Settings',language:'Language',logout:'Sign out',hello:'Hello',recent:'Recent orders',loading:'Loading orders…',empty:'No orders yet.',client:'Client',email:'Email',pack:'Package',pages:'Pages',total:'Total',deadline:'Desired date',status:'Status',see:'View details',new:'New orders',progress:'In progress',almost:'Almost done',delivered:'Delivered',detail:'Order details',save:'Save',saving:'Saving…',saved:'Changes saved in D1.',notes:'Internal notes',pricing:'Pricing',pricingIntro:'These prices are used by new orders. Existing orders keep their price snapshot.',priceSaved:'Pricing saved.',network:'The server is unavailable. Please try again.',access:'Cloudflare Access is required for administration.',received:'Received',approved:'Approved',in_progress:'In production',almost_done:'Almost done',deliveredStatus:'Delivered',orderCount:'orders',latest:'Latest order',noClients:'No clients yet.'},vi:{dashboard:'Tổng quan',clients:'Khách hàng',orders:'Đơn hàng',settings:'Cài đặt',language:'Ngôn ngữ',logout:'Đăng xuất',hello:'Xin chào',recent:'Đơn hàng gần đây',loading:'Đang tải đơn hàng…',empty:'Chưa có đơn hàng.',client:'Khách hàng',email:'Email',pack:'Gói',pages:'Số trang',total:'Tổng cộng',deadline:'Ngày mong muốn',status:'Trạng thái',see:'Xem chi tiết',new:'Đơn mới',progress:'Đang thực hiện',almost:'Gần hoàn thành',delivered:'Đã bàn giao',detail:'Chi tiết đơn hàng',save:'Lưu',saving:'Đang lưu…',saved:'Đã lưu thay đổi vào D1.',notes:'Ghi chú nội bộ',pricing:'Bảng giá',pricingIntro:'Giá này áp dụng cho đơn mới. Đơn cũ vẫn giữ snapshot giá.',priceSaved:'Đã lưu bảng giá.',network:'Máy chủ không khả dụng. Hãy thử lại.',access:'Cần Cloudflare Access để quản trị.',received:'Đã nhận',approved:'Đã duyệt',in_progress:'Đang thực hiện',almost_done:'Gần hoàn thành',deliveredStatus:'Đã bàn giao',orderCount:'đơn hàng',latest:'Đơn gần nhất',noClients:'Chưa có khách hàng.'}};
let lang=localStorage.nas_lang||'fr',theme=localStorage.nas_theme||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'),orders=[];
const t=k=>D[lang][k]||k,$=s=>document.querySelector(s),money=c=>`€${(c/100).toFixed(0)}`;
function paint(){document.documentElement.dataset.theme=theme;
localStorage.nas_theme=theme;
for(const id of['logo','mobileLogo'])$('#'+id).src=LOGOS[theme];
themeBtn.textContent=theme==='dark'?'☀':'☾';
language.value=lang;
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
document.querySelectorAll('[data-view]').forEach(e=>e.textContent=t(e.dataset.view));
pageTitle.textContent=t('dashboard')}const themeBtn=$('#theme'),language=$('#language'),pageTitle=$('#pageTitle');
function modal(title,body){$('#modalRoot').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true"><header class="modal-head"><h2>${title}</h2><button class="close">×</button></header>${body}</section></div>`;
$('.close').onclick=close;
$('.overlay').onclick=e=>{if(e.target===e.currentTarget)close()}}function close(){$('#modalRoot').innerHTML=''}document.onkeydown=e=>{if(e.key==='Escape')close()};
async function request(path,opts){const r=await fetch(API+path,{...opts,credentials:'include',cache:'no-store'});
if(!r.ok){const b=await r.json().catch(()=>({}));
const err=Error(b.error?.code||'network');err.status=r.status;throw err}return r.json()}function statuses(){return ['received','approved','in_progress','almost_done','delivered']}function render(){const c={received:0,in_progress:0,almost_done:0,delivered:0};
orders.forEach(o=>c[o.status]++);
dashboard.innerHTML=`<article class="panel stat"><span>${t('new')}</span><b>${c.received}</b><span>${t('received')}</span></article><article class="panel stat"><span>${t('progress')}</span><b>${c.in_progress}</b><span>${t('in_progress')}</span></article><article class="panel stat"><span>${t('almost')}</span><b>${c.almost_done}</b><span>${t('almost_done')}</span></article><article class="panel stat"><span>${t('delivered')}</span><b>${c.delivered}</b><span>${t('deliveredStatus')}</span></article><article class="panel wide"><div class="panel-head"><h2>${t('recent')}</h2></div>${rows(orders.slice(0,7))}</article>`}function rows(a){return a.length?a.map(o=>`<div class="row"><div><b>${o.id}</b><br><small>${o.client_name}</small></div><small>${o.package_code}</small><small>${o.pages}</small><small>${money(o.total_price_snapshot_cents)}</small><span class="status">${t(o.status==='delivered'?'deliveredStatus':o.status)}</span><button class="link" data-order="${o.id}">${t('see')}</button></div>`).join(''):`<div class="empty">${t('empty')}</div>`}async function load(){dashboard.innerHTML=`<div class="state">${t('loading')}</div>`;
try{orders=(await request('/admin/orders')).orders;
render()}catch(e){dashboard.innerHTML=`<div class="state">${e.message==='access_required'?t('access'):t('network')}</div>`}}function showOrder(id){const o=orders.find(x=>x.id===id);
if(!o)return;
const info=Object.entries(o.website_information||{}).map(([k,v])=>`<div class="detail"><span>${k.replaceAll('_',' ')}</span><b>${v||'—'}</b></div>`).join('');
modal(t('detail'),`<div class="details"><div class="detail"><span>${t('client')}</span><b>${o.client_name}</b></div><div class="detail"><span>${t('email')}</span><b>${o.client_email}</b></div><div class="detail"><span>${t('pack')}</span><b>${o.package_code}</b></div><div class="detail"><span>${t('pages')}</span><b>${o.pages}</b></div><div class="detail"><span>Features</span><b>${o.features.join(', ')}</b></div><div class="detail"><span>Logo</span><b>${o.logo_addon?'Yes':'No'}</b></div>${info}</div><form id="edit" class="manage"><label class="field">${t('status')}<select name="status">${statuses().map(s=>`<option ${o.status===s?'selected':''} value="${s}">${t(s==='delivered'?'deliveredStatus':s)}</option>`).join('')}</select></label><label class="field">${t('deadline')}<input name="deadline" type="date" value="${o.deadline}"></label><label class="field">${t('pack')}<select name="package_code">${['STARTER','ESSENTIAL','BUSINESS','CUSTOM'].map(p=>`<option ${p===o.package_code?'selected':''}>${p}</option>`).join('')}</select></label><label class="field">${t('total')} (€)<input name="price" type="number" min="0" step="0.01" value="${(o.total_price_snapshot_cents/100).toFixed(2)}"></label><label class="field wide">${t('notes')}<textarea name="admin_notes">${o.admin_notes||''}</textarea></label><div class="savebar"><span id="saveMsg" class="message"></span><button class="button">${t('save')}</button></div></form>`);
edit.onsubmit=async e=>{e.preventDefault();
const b=edit.querySelector('button'),m=$('#saveMsg'),fd=new FormData(edit);
b.disabled=true;
b.textContent=t('saving');
try{await request('/admin/orders/'+o.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:fd.get('status'),deadline:fd.get('deadline'),package_code:fd.get('package_code'),admin_notes:fd.get('admin_notes'),total_price_cents:Math.round(+fd.get('price')*100)})});
m.className='message ok';
m.textContent=t('saved');
await load()}catch{m.textContent=t('network');
b.disabled=false;
b.textContent=t('save')}}}async function showClients(){modal(t('clients'),`<div class="state">${t('loading')}</div>`);
try{const clients=(await request('/admin/clients')).clients;
$('.state').outerHTML=clients.length?clients.map(c=>`<div class="row"><b>${c.name}</b><small>${c.email}</small><small>${c.order_count} ${t('orderCount')}</small><small>${c.latest_order_at||'—'}</small></div>`).join(''):`<div class="empty">${t('noClients')}</div>`}catch{$('.state').textContent=t('network')}}async function settings(){modal(t('pricing'),`<p class="state">${t('loading')}</p>`);
try{const p=(await request('/admin/pricing')).pricing;
$('.state').outerHTML=`<p class="state">${t('pricingIntro')}</p><form id="priceForm" class="pricing">${Object.entries(p).map(([code,c])=>`<label class="field">${code}<input name="${code}" type="number" min="0" step="0.01" value="${(c/100).toFixed(2)}"></label>`).join('')}<div class="savebar"><span id="priceMsg" class="message"></span><button class="button">${t('save')}</button></div></form>`;
priceForm.onsubmit=async e=>{e.preventDefault();
let p={};
new FormData(priceForm).forEach((v,k)=>p[k]=Math.round(+v*100));
try{await request('/admin/pricing',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({pricing:p})});
priceMsg.className='message ok';
priceMsg.textContent=t('priceSaved')}catch{priceMsg.textContent=t('network')}}}catch{$('.state').textContent=t('network')}}document.addEventListener('click',e=>{if(e.target.dataset.order)showOrder(e.target.dataset.order);
const v=e.target.dataset.view;
if(v==='clients')showClients();
if(v==='orders')modal(t('orders'),rows(orders));
if(v==='settings')settings();
if(v==='dashboard')render();
side.classList.remove('open')});
$('#menu').onclick=()=>side.classList.toggle('open');
themeBtn.onclick=()=>{theme=theme==='dark'?'light':'dark';
paint()};
language.onchange=e=>{lang=e.target.value;
localStorage.nas_lang=lang;
paint();
render()};
$('#logout').onclick=()=>{location.href='/cdn-cgi/access/logout';};
paint();
(async()=>{try{const session=await request('/admin/session');if(session.email!=='vunamanhnguyen@proton.me')throw Object.assign(Error('access_denied'),{status:403});adminEmail.textContent=session.email;await load()}catch(e){adminEmail.textContent='';dashboard.innerHTML=`<div class="panel wide state">${e.status===401?t('access'):e.status===403?'Access denied.':t('network')}</div>`}})();

</script></body></html>
