  const F={responsive:'Responsive design',navigation:'Navigation',basic_animations:'Basic animations',social_links:'Social links',contact_section:'Contact section',deployment:'Website deployment',domain:'First-year domain',revisions:'Revisions',custom_design:'Custom design',basic_seo:'Basic SEO',contact_form:'Contact form',maps:'Google Maps',opening_hours:'Opening hours',gallery:'Image gallery',advanced_animations:'Advanced animations',custom_features:'Custom features',booking:'Booking system',api:'API integration',multilingual:'Multilingual support'};
  const PACK={STARTER:{max:1,features:['responsive','navigation','basic_animations','social_links','contact_section','deployment','domain','revisions']},ESSENTIAL:{max:5,features:['responsive','navigation','basic_animations','social_links','contact_section','deployment','domain','revisions','custom_design','basic_seo']},BUSINESS:{max:8,features:['responsive','navigation','basic_animations','social_links','contact_section','deployment','domain','revisions','custom_design','basic_seo','contact_form','maps','opening_hours','gallery']},CUSTOM:{max:99,features:Object.keys(F)}};
  let lang=localStorage.getItem('nas_lang')||'fr', theme=localStorage.getItem('nas_theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'), prices=null;
  const t=k=>D[lang][k]||k, root=document.documentElement, $=s=>document.querySelector(s), money=c=>`€${(c/100).toFixed(0)}`;
  function paint(){root.lang=lang;root.dataset.theme=theme;localStorage.setItem('nas_theme',theme);$('#logo').src=LOGOS[theme];$('#theme').textContent=theme==='dark'?'☀':'☾';$('#language').value=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));}
  function modal(title,body,narrow=false){$('#modalRoot').innerHTML=`<div class="overlay"><section class="modal ${narrow?'narrow':''}" role="dialog" aria-modal="true"><header class="modal-head"><div><div class="eyebrow">Nam Anh Studio</div><h2>${title}</h2></div><button class="close" data-close aria-label="${t('close')}">×</button></header>${body}</section></div>`;document.querySelector('[data-close]').focus();$('.overlay').onclick=e=>{if(e.target===e.currentTarget)closeModal()}}
  function closeModal(){$('#modalRoot').innerHTML=''} document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  async function getPrices(){if(prices)return prices;const r=await fetch(API+'/pricing');if(!r.ok)throw Error();prices=(await r.json()).pricing;return prices}
  function orderModal(){modal(t('orderTitle'),`<p style="color:var(--sub)">${t('orderIntro')}</p><div id="orderLoading" class="loading">${t('loading')}</div><form id="orderForm" class="hidden" novalidate></form>`);getPrices().then(buildOrder).catch(()=>{$('#orderLoading').textContent=t('sendError')})}
  function buildOrder(){const cards=Object.keys(PACK).map((p,i)=>`<label class="pack"><input type="radio" name="package" value="${p}" ${i?'':'checked'}><b>${p}</b><strong>${p==='CUSTOM'?t('from')+' '+money(prices[p]):money(prices[p])}</strong><small>${p==='STARTER'?'1':p==='ESSENTIAL'?'1–5':p==='BUSINESS'?'1–8':'1+'} ${t('pages').toLowerCase()}</small></label>`).join('');const field=(key,tag='textarea',required=false,wide=false)=>`<div class="field ${wide?'wide':''}"><label>${t(key)}${required?' *':''}</label>${tag==='textarea'?`<textarea name="${key}" ${required?'required':''}></textarea>`:`<input name="${key}" type="${tag}" ${required?'required':''}>`}</div>`;$('#orderLoading').remove();const form=$('#orderForm');form.classList.remove('hidden');form.innerHTML=`<div class="order-layout"><div><section class="section"><div class="step">01 — ${t('formula')}</div><h3>${t('formula')}</h3><div class="packs">${cards}</div></section><section class="section"><div class="step">02 — ${t('pagesFeatures')}</div><h3>${t('pagesFeatures')}</h3><div class="field" style="max-width:190px"><label>${t('pages')}</label><select id="pages" name="pages"></select></div><div class="features" id="features" style="margin-top:15px"></div></section><section class="section"><div class="step">03 — ${t('siteInfo')}</div><h3>${t('siteInfo')}</h3><div class="fields">${field('clientName','text',true)}${field('email','email',true)}${field('project','textarea',true,true)}${field('activity','textarea',true)}${field('description','textarea',true)}${field('objective','textarea',true)}${field('audience')} ${field('content','textarea',true,true)}${field('wantedPages','textarea',true)}${field('style','textarea',true)}${field('colors','textarea',true)}${field('references','textarea',true,true)}${field('additional','textarea',true,true)}</div></section><section class="section"><div class="step">04 — ${t('deadline')}</div><h3>${t('deadline')}</h3><div class="field" style="max-width:230px"><label>${t('date')} *</label><input id="deadline" name="deadline" type="date" required></div></section><section class="section"><div class="step">05 — ${t('options')}</div><h3>${t('options')}</h3><label class="feature"><input type="checkbox" name="logo"> ${t('logo')}</label></section></div><aside class="summary"><h3>${t('summary')}</h3><div class="sum"><span>${t('pack')}</span><b id="sumPack">STARTER</b></div><div class="sum"><span>${t('pages')}</span><b id="sumPages">1</b></div><div class="sum"><span>${t('features')}</span><b id="sumFeatures">0</b></div><div class="sum"><span>${t('logo')}</span><b id="sumLogo">—</b></div><div class="total"><span>${t('total')}</span><b id="sumTotal">—</b></div><div id="formMessage" class="message"></div><button class="button" type="submit">${t('send')}</button></aside></div>`;$('#deadline').min=new Date().toISOString().slice(0,10);form.addEventListener('change',updateOrder);updateOrder();form.onsubmit=submitOrder}
  function updateOrder(){const p=$('[name=package]:checked').value, cfg=PACK[p], pages=$('#pages'), old=+pages.value||1;pages.innerHTML=Array.from({length:cfg.max},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');pages.value=Math.min(old,cfg.max);$('#features').innerHTML=Object.entries(F).map(([key,label])=>{const ok=cfg.features.includes(key), needed=['advanced_animations','custom_features','booking','api','multilingual'].includes(key)?'CUSTOM':['contact_form','maps','opening_hours','gallery'].includes(key)?'BUSINESS':['custom_design','basic_seo'].includes(key)?'ESSENTIAL':'STARTER';return `<label class="feature ${ok?'':'locked'}"><input type="checkbox" value="${key}" ${ok?'checked':''} ${ok?'':'disabled'}><span>${label}</span><em>${ok?t('included'):t('requires')+' '+needed}</em></label>`}).join('');const logo=$('[name=logo]').checked, base=prices[p], add=logo?prices.LOGO:0;$('#sumPack').textContent=p;$('#sumPages').textContent=pages.value;$('#sumFeatures').textContent=$('#features').querySelectorAll('input:checked').length;$('#sumLogo').textContent=logo?'+ '+money(add):'—';$('#sumTotal').textContent=p==='CUSTOM'?t('from')+' '+money(base):money(base+add)}
  async function submitOrder(e){e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;if($('#deadline').value<$('#deadline').min){$('#formMessage').textContent=t('dateError');return}const button=f.querySelector('[type=submit]');button.disabled=true;button.textContent=t('sending');const fd=new FormData(f), info={project_name:fd.get('project'),activity:fd.get('activity'),description:fd.get('description'),objective:fd.get('objective'),target_audience:fd.get('audience'),desired_content:fd.get('content'),desired_pages:fd.get('wantedPages'),style:fd.get('style'),colors:fd.get('colors'),references:fd.get('references'),additional_information:fd.get('additional')};const payload={client:{name:fd.get('clientName'),email:fd.get('email')},package_code:fd.get('package'),pages:+fd.get('pages'),features:[...$('#features').querySelectorAll('input:checked')].map(x=>x.value),website_information:info,deadline:fd.get('deadline'),logo_addon:fd.has('logo')};try{const r=await fetch(API+'/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error?.message||t('serverError'));if(!data.order_id||!data.tracking_token)throw Error(t('serverError'));showSuccess(data)}catch(err){$('#formMessage').textContent=err.message||t('sendError');button.disabled=false;button.textContent=t('send')}}
  function showSuccess(data){modal(t('sent'),`<div class="tracker"><p>${t('sentNote')}</p><div class="eyebrow">${t('track')}</div><div class="order-id">${data.order_id}</div><input id="trackingLink" value="${location.origin+'/track/'+data.tracking_token}" readonly><button class="button" id="openTracking" style="margin-top:14px">${t('follow')}</button></div>`,true);$('#openTracking').onclick=()=>showTracking(data.tracking_token)}
  function trackingModal(token=''){modal(t('trackTitle'),`<p style="color:var(--sub)">${t('trackIntro')}</p><div class="field"><label>${t('token')}</label><input id="trackingToken" value="${token}" autocomplete="off"></div><button id="lookUp" class="button" style="margin-top:14px">${t('see')}</button><div id="trackResult"></div>`,true);$('#lookUp').onclick=loadTracking;if(token)loadTracking()}
  async function loadTracking(){const token=$('#trackingToken').value.trim().replace(/^.*#track=/,'');const result=$('#trackResult');result.innerHTML=`<div class="loading">${t('loading')}</div>`;try{const r=await fetch(API+'/track/'+encodeURIComponent(token));if(!r.ok)throw Error();const o=(await r.json()).order;const flow=['received','approved','in_progress','almost_done','delivered'], at=flow.indexOf(o.status);result.innerHTML=`<div class="tracker"><div class="order-id">${o.id}</div><div class="timeline">${flow.map((s,i)=>`<div class="event ${i<=at?'done':''}">${t(s)}</div>`).join('')}</div><div class="order-mini"><span>${t('pack')}</span><b>${o.package_code}</b></div><div class="order-mini"><span>${t('total')}</span><b>${money(o.total_price_snapshot_cents)}</b></div></div>`}catch{result.innerHTML=`<div class="message">${t('notFound')}</div>`}}
  document.addEventListener('click',e=>{const action=e.target.dataset.open;if(action==='order')orderModal();if(action==='track')trackingModal();if(action==='home')scrollTo({top:0,behavior:'smooth'});if(e.target===document.querySelector('[data-close]'))closeModal()});$('#language').onchange=e=>{lang=e.target.value;localStorage.setItem('nas_lang',lang);paint()};$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';paint()};$('#menu').onclick=()=>trackingModal();paint();const trackPath=location.pathname.match(/^\/track\/([a-f0-9]{32})$/);if(trackPath)trackingModal(trackPath[1]);else if(location.hash.startsWith('#track='))trackingModal(location.hash.slice(7));
  </script>
</body></html>
